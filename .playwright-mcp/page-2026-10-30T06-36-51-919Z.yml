    - heading "Common mistake" [level=2] [ref=f1e204]
    - paragraph [ref=f1e205]:
      - text: Do not assume a
      - code [ref=f1e206]: HashMap
      - text: or
      - code [ref=f1e207]: HashSet
      - text: prints items in insertion or sorted order. If output order matters, choose an ordered collection or sort the results explicitly.
    - heading "Interview question" [level=2] [ref=f1e208]
    - paragraph [ref=f1e209]: Why must equals() and hashCode() agree? A hash-based collection uses the hash to select where to search and equality to identify the key. Equal keys with different hashes can be placed in different buckets and fail lookup.
