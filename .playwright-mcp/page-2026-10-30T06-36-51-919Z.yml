    - heading "What the map contract means for your keys" [level=3] [ref=f1e160]
    - list [ref=f1e161]:
      - listitem [ref=f1e162]:
        - text: If two keys are equal according to
        - code [ref=f1e163]: equals()
        - text: ", they must return the same"
        - code [ref=f1e164]: hashCode()
        - text: .
      - listitem [ref=f1e165]:
        - text: Do not mutate fields used by
        - code [ref=f1e166]: equals()
        - text: or
        - code [ref=f1e167]: hashCode()
        - text: while an object is a map key.
      - listitem [ref=f1e168]:
        - code [ref=f1e169]: HashMap
        - text: and
        - code [ref=f1e170]: HashSet
        - text: do not promise iteration order. Use linked variants for insertion order and tree variants for sorted order.
      - listitem [ref=f1e171]:
        - code [ref=f1e172]: Hashtable
        - text: is a legacy synchronized map. For shared concurrent access, prefer the operations and guarantees of
        - code [ref=f1e173]: ConcurrentHashMap
        - text: .
    - heading "Iteration and performance" [level=2] [ref=f1e174]
    - paragraph [ref=f1e175]:
      - text: A fail-fast iterator may throw
      - code [ref=f1e176]: ConcurrentModificationException
      - text: "when the collection is structurally changed outside that iterator. This is a best-effort bug detector, not a thread-safety guarantee. Concurrent collections may instead provide weakly consistent iterators: they can safely proceed while updates occur, but may not reflect every update made during the traversal."
    - paragraph [ref=f1e177]:
      - code [ref=f1e178]: ConcurrentHashMap
      - text: supports concurrent reads and updates without locking the entire map for every operation. Its iterators are weakly consistent. Legacy
      - code [ref=f1e179]: Hashtable
      - text: synchronizes individual operations but is usually not the best choice for new concurrent code.
