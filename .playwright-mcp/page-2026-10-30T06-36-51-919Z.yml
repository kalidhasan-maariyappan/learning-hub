    - separator [ref=f1e86]
    - heading "Choose a collection by the job it does" [level=2] [ref=f1e87]
    - paragraph [ref=f1e88]: The Collections Framework provides interfaces and implementations for groups of objects. Choose the interface from the behavior you need, then choose an implementation that fits the size, ordering, concurrency and access pattern.
    - table [ref=f1e90]:
      - rowgroup [ref=f1e91]:
        - row [ref=f1e92]:
          - columnheader "Interface" [ref=f1e93]
          - columnheader "Use it for" [ref=f1e94]
          - columnheader "Common implementations" [ref=f1e95]
      - rowgroup [ref=f1e96]:
        - row [ref=f1e97]:
          - cell "List" [ref=f1e98]
          - cell "Ordered items; duplicates are allowed." [ref=f1e99]
          - cell "ArrayList, LinkedList" [ref=f1e100]
        - row [ref=f1e101]:
          - cell "Set" [ref=f1e102]
          - cell "Unique items." [ref=f1e103]
          - cell "HashSet, LinkedHashSet, TreeSet" [ref=f1e104]
        - row [ref=f1e105]:
          - cell "Queue / Deque" [ref=f1e106]
          - cell "Items processed in a queue or at either end." [ref=f1e107]
          - cell "ArrayDeque, PriorityQueue" [ref=f1e108]
        - row [ref=f1e109]:
          - cell "Map" [ref=f1e110]
          - cell "Values looked up by keys." [ref=f1e111]
          - cell "HashMap, LinkedHashMap, TreeMap" [ref=f1e112]
    - paragraph [ref=f1e113]:
      - code [ref=f1e114]: ArrayList
      - text: is a strong default for indexed access and appending.
      - code [ref=f1e115]: LinkedList
      - text: is a doubly linked list, but indexed access walks nodes, so it is rarely a faster list choice.
      - code [ref=f1e116]: ArrayDeque
      - text: is usually preferable to
      - code [ref=f1e117]: Stack
      - text: for stack or queue behavior.
      - code [ref=f1e118]: PriorityQueue
      - text: exposes the smallest (or comparator-first) item, not a fully sorted iteration.
    - paragraph [ref=f1e119]:
      - text: A class can implement
      - code [ref=f1e120]: Comparable<T>
      - text: to define one natural ordering through
      - code [ref=f1e121]: compareTo
      - text: . A
      - code [ref=f1e122]: Comparator<T>
      - text: supplies an ordering from outside the class, so the same objects can be sorted by different fields. An
      - code [ref=f1e123]: Iterator
      - text: moves forward; a
      - code [ref=f1e124]: ListIterator
      - text: can also move backward and update a list during traversal.
    - heading "Hashing, collisions and HashMap lookup" [level=2] [ref=f1e125]
    - paragraph [ref=f1e126]:
      - text: A hash map uses a key’s
      - code [ref=f1e127]: hashCode()
      - text: to choose a bucket, then uses
      - code [ref=f1e128]: equals()
      - text: to identify the key within that bucket. Different keys can land in the same bucket; this is a collision, and the map still checks equality. When the table gets too full, it resizes and redistributes entries. Exact thresholds and internal layout are implementation details, so code should rely on the Map contract rather than a particular bucket count.
