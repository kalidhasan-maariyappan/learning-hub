    - heading "Key points" [level=2] [ref=f2e102]
    - list [ref=f2e103]:
      - listitem [ref=f2e104]: Different keys can have the same hash code.
      - listitem [ref=f2e105]: equals() distinguishes keys that collide.
      - listitem [ref=f2e106]: Good hash functions spread common key values across buckets.
    - heading "Common mistake" [level=2] [ref=f2e107]
    - paragraph [ref=f2e108]: A collision does not overwrite an existing value unless the new key is equal to the existing key.
