  - main [ref=f2e81]:
    - heading "Java Hash collisions" [level=1] [ref=f2e82]
    - generic [ref=f2e83]:
      - link "❮ Previous" [ref=f2e84] [cursor=pointer]:
        - /url: /java-core-advanced/java_ca_hashmap_internals_bucket_index
      - link "Next ❯" [ref=f2e85] [cursor=pointer]:
        - /url: /java-core-advanced/java_ca_hashmap_internals_tree_bins
    - separator [ref=f2e86]
    - heading "What is it?" [level=2] [ref=f2e87]
    - paragraph [ref=f2e88]: A hash collision occurs when different keys produce the same bucket index. A collision does not mean the keys are equal.
    - heading "Why does it matter?" [level=2] [ref=f2e89]
    - paragraph [ref=f2e90]: Hash codes are integers but the set of possible keys is much larger. A map must remain correct even when several keys share a bucket.
    - heading "How does it work?" [level=2] [ref=f2e91]
    - paragraph [ref=f2e92]: HashMap searches entries in the chosen bucket and uses equality to identify a matching key. If no equal key exists, it adds another entry to that bucket.
    - heading "Java example" [level=2] [ref=f2e93]
    - generic [ref=f2e94]:
      - heading "Hash collisions" [level=3] [ref=f2e95]
      - generic [ref=f2e96]: "import java.util.HashMap; import java.util.Map; class Item { final String name; Item(String name) { this.name = name; } public int hashCode() { return 7; } public boolean equals(Object o) { return o instanceof Item i && name.equals(i.name); } } public class Main { public static void main(String[] args) { Map<Item, Integer> counts = new HashMap<>(); counts.put(new Item(\"tea\"), 2); counts.put(new Item(\"rice\"), 5); System.out.println(counts.size()); System.out.println(counts.get(new Item(\"rice\"))); } }"
      - generic [ref=f2e97]:
        - link "Try it Yourself »" [ref=f2e98] [cursor=pointer]:
          - /url: /tryit?page=java_ca_hashmap_internals_hash_collisions&ex=0
