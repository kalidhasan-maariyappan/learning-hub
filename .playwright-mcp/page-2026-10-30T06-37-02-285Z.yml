    - separator [ref=f3e179]
    - heading "HashMap" [level=2] [ref=f3e180]
    - paragraph [ref=f3e181]:
      - code [ref=f3e182]: HashMap
      - text: "is the everyday map: fast lookups by key, with no guaranteed order."
    - generic [ref=f3e183]:
      - heading "Example" [level=3] [ref=f3e184]
      - generic [ref=f3e185]: "HashMap<String, Integer> stock = new HashMap<>(); stock.put(\"apples\", 40); stock.put(\"pears\", 12); stock.put(\"apples\", 35); // replaces 40 System.out.println(\"apples: \" + stock.get(\"apples\")); System.out.println(\"plums: \" + stock.get(\"plums\")); System.out.println(\"has pears? \" + stock.containsKey(\"pears\")); stock.remove(\"pears\"); System.out.println(\"items: \" + stock.size());"
      - generic [ref=f3e186]:
        - link "Try it Yourself »" [ref=f3e187] [cursor=pointer]:
          - /url: /tryit?page=java_hashmap&ex=0
        - button "Run here" [ref=f3e188] [cursor=pointer]
    - heading "Counting with a map" [level=2] [ref=f3e189]
    - paragraph [ref=f3e190]:
      - text: "A very common pattern: count how often each thing occurs."
      - code [ref=f3e191]: merge
      - text: adds 1 to the existing count, or starts at 1.
    - generic [ref=f3e192]:
      - heading "Example" [level=3] [ref=f3e193]
      - generic [ref=f3e194]: "String text = \"to be or not to be that is the question\"; Map<String, Integer> counts = new HashMap<>(); for (String w : text.split(\" \")) { counts.merge(w, 1, Integer::sum); } // sort the keys for a predictable display for (String w : new TreeSet<>(counts.keySet())) { System.out.println(w + \": \" + counts.get(w)); }"
      - generic [ref=f3e195]:
        - link "Try it Yourself »" [ref=f3e196] [cursor=pointer]:
          - /url: /tryit?page=java_hashmap&ex=1
        - button "Run here" [ref=f3e197] [cursor=pointer]
    - heading "Values that are collections" [level=2] [ref=f3e198]
    - generic [ref=f3e199]:
      - heading "Example" [level=3] [ref=f3e200]
      - generic [ref=f3e201]: "Map<String, List<String>> byTeam = new HashMap<>(); String[][] people = { { \"Ola\", \"red\" }, { \"Kai\", \"blue\" }, { \"Ren\", \"red\" }, { \"Ivy\", \"blue\" }, { \"Zed\", \"red\" } }; for (String[] p : people) { byTeam.computeIfAbsent(p[1], k -> new ArrayList<>()).add(p[0]); } System.out.println(\"red: \" + byTeam.get(\"red\")); System.out.println(\"blue: \" + byTeam.get(\"blue\"));"
