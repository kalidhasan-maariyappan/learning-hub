    - separator [ref=f4e86]
    - heading "Hash collisions" [level=2] [ref=f4e87]
    - paragraph [ref=f4e88]: A hash collision occurs when different keys produce the same bucket index. A collision does not mean the keys are equal.
    - paragraph [ref=f4e89]: Hash codes are integers but the set of possible keys is much larger. A map must remain correct even when several keys share a bucket.
    - generic [ref=f4e90]:
      - heading "Example" [level=3] [ref=f4e91]
      - generic [ref=f4e92]: "import java.util.HashMap; import java.util.Map; class Item { final String name; Item(String name) { this.name = name; } public int hashCode() { return 7; } public boolean equals(Object o) { return o instanceof Item i && name.equals(i.name); } } public class Main { public static void main(String[] args) { Map<Item, Integer> counts = new HashMap<>(); counts.put(new Item(\"tea\"), 2); counts.put(new Item(\"rice\"), 5); System.out.println(counts.size()); System.out.println(counts.get(new Item(\"rice\"))); } }"
      - generic [ref=f4e93]:
        - link "Try it Yourself »" [ref=f4e94] [cursor=pointer]:
          - /url: /tryit?page=java_ca_hashmap_internals_hash_collisions&ex=0
        - button "Run here" [ref=f4e95] [cursor=pointer]
      - generic [ref=f4e96]: Output 2 5
    - heading "How it works" [level=2] [ref=f4e97]
    - paragraph [ref=f4e98]: HashMap searches entries in the chosen bucket and uses equality to identify a matching key. If no equal key exists, it adds another entry to that bucket.
    - generic [ref=f4e99]:
      - paragraph [ref=f4e100]:
        - strong [ref=f4e101]: Remember
      - list [ref=f4e102]:
        - listitem [ref=f4e103]: Different keys can have the same hash code.
        - listitem [ref=f4e104]: equals() distinguishes keys that collide.
        - listitem [ref=f4e105]: Good hash functions spread common key values across buckets.
    - paragraph [ref=f4e107]:
      - strong [ref=f4e108]: "Common mistake:"
      - text: A collision does not overwrite an existing value unless the new key is equal to the existing key.
