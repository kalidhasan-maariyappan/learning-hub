    - heading "HashMap Internals" [level=2] [ref=f5e87]
    - paragraph [ref=f5e88]: HashMap stores key-value pairs in a table of buckets. A key hash narrows the search to a bucket, and equality identifies the matching key there.
    - paragraph [ref=f5e89]: Knowing this behavior helps explain lookup speed, collisions, resizing, key requirements and why changing a key after insertion breaks lookups.
    - generic [ref=f5e90]:
      - paragraph [ref=f5e91]:
        - strong [ref=f5e92]: In this section
      - list [ref=f5e93]:
        - listitem [ref=f5e94]: HashMap iteration order is unspecified.
        - listitem [ref=f5e95]: Collisions are handled within a bucket.
        - listitem [ref=f5e96]: Never mutate fields used by a key’s equals() or hashCode() while it is stored.
