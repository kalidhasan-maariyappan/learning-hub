    - paragraph [ref=f8e84]:
      - text: A block is a chunk of code passed to a method, written with
      - code [ref=f8e85]: "{ }"
      - text: or
      - code [ref=f8e86]: do ... end
      - text: . The method runs the block with
      - code [ref=f8e87]: yield
      - text: .
    - generic [ref=f8e88]:
