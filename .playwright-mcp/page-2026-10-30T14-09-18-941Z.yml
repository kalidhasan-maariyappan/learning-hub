    - heading "Ruby Hashes" [level=2] [ref=f11e82]
    - paragraph [ref=f11e83]: A hash stores key-value pairs. Keys are usually symbols. Hashes keep the order in which keys were inserted.
    - generic [ref=f11e84]:
      - heading "Example" [level=3] [ref=f11e85]
      - generic [ref=f11e86]: "user = { name: \"Ada\", age: 36 } puts user[:name] user[:city] = \"London\" user[:age] += 1 p user p user[:email]"
      - generic [ref=f11e87]:
        - link "Try it Yourself »" [ref=f11e88] [cursor=pointer]:
          - /url: /tryit?page=ruby_hashes&ex=0
        - button "Run here" [ref=f11e89] [cursor=pointer]
      - generic [ref=f11e90]: "Output Ada {name: \"Ada\", age: 37, city: \"London\"} nil"
    - heading "Loop through a hash" [level=2] [ref=f11e91]
    - generic [ref=f11e92]:
      - heading "Example" [level=3] [ref=f11e93]
      - generic [ref=f11e94]: "prices = { tea: 3, cake: 5 } prices.each do |item, price| puts \"#{item} costs #{price}\" end"
      - generic [ref=f11e95]:
        - link "Try it Yourself »" [ref=f11e96] [cursor=pointer]:
          - /url: /tryit?page=ruby_hashes&ex=1
        - button "Run here" [ref=f11e97] [cursor=pointer]
      - generic [ref=f11e98]: Output tea costs 3 cake costs 5
    - heading "Default values" [level=2] [ref=f11e99]
    - paragraph [ref=f11e100]:
      - code [ref=f11e101]: Hash.new(0)
      - text: "returns 0 for missing keys, which makes counting easy:"
    - generic [ref=f11e102]:
      - heading "Example" [level=3] [ref=f11e103]
      - generic [ref=f11e104]: "counts = Hash.new(0) \"banana\".each_char { |c| counts[c] += 1 } p counts"
