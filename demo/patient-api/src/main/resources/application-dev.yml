spring:
    h2:
        console:
            enabled: true
            path: /h2-console
            settings:
                web-allow-others: false
springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true
app:
    bootstrap:
        admin-email: ${ADMIN_EMAIL:}
        admin-password: ${ADMIN_PASSWORD:}
        admin-name: ${ADMIN_NAME:Development Admin}
