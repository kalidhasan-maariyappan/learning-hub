spring:
    application:
        name: patient-api
    datasource:
        url: ${DATABASE_URL:jdbc:h2:file:./data/patientdb}
        username: ${DATABASE_USERNAME:sa}
        password: ${DATABASE_PASSWORD:}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
    flyway:
        enabled: true
    jackson:
        deserialization:
            fail-on-unknown-properties: true
server:
    port: 8080
    error:
        include-message: never
        include-stacktrace: never
app:
    jwt:
        secret: ${JWT_SECRET}
        issuer: ${JWT_ISSUER:patient-api}
        expiration: 15m
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:}
springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false
logging:
    level:
        root: INFO
        org.springframework.security: WARN
