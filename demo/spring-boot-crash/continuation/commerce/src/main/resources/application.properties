server.port=${PORT:8090}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/commerce;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.health.rabbit.enabled=false
management.health.mail.enabled=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
payment.base-url=${PAYMENT_BASE_URL:https://api.stripe.com}
payment.key=${STRIPE_SECRET_KEY:}
payment.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.public-url=${PUBLIC_URL:http://localhost:8090}
app.mail-from=${MAIL_FROM:learning@example.test}
app.upload-directory=${UPLOAD_DIRECTORY:./uploads}

logging.level.root=INFO
management.health.rabbit.enabled=false
