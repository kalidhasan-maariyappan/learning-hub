server.port=${PORT:8100}
node.role=${NODE_ROLE:order}
spring.datasource.url=${WORKFLOW_DB:jdbc:h2:file:./data/${node.role};DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
inventory.url=${INVENTORY_URL:http://localhost:8101}
payment.url=${PAYMENT_URL:http://localhost:8102}
workflow.mode=${WORKFLOW_MODE:orchestration}
workflow.secret=${WORKFLOW_SECRET:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
management.health.rabbit.enabled=false
