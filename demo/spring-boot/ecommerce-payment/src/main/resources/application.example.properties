# Copy to application.properties and fill literal test credentials. No env vars needed.
razorpay.mode=test
razorpay.key-id=rzp_test_REPLACE_ME
razorpay.key-secret=REPLACE_ME
razorpay.webhook-secret=
spring.application.name=Form and Field
server.address=127.0.0.1
server.port=8093
spring.datasource.url=jdbc:h2:file:./data/store;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=LocalStoreTestOnly
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.h2.console.enabled=false
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.admin.email=admin@formandfield.test
app.admin.password=AdminTest@2026!
