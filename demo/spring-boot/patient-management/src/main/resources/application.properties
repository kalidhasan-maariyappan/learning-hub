spring.application.name=patient-management
server.port=8080

# H2 file database (persists in ./data between restarts). Learning setup only.
spring.datasource.url=jdbc:h2:file:./data/patientdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update is for learning only; use Flyway/Liquibase in real deployments.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Enable when running behind HTTPS:
# server.servlet.session.cookie.secure=true

# H2 console stays disabled in the secured application.
spring.h2.console.enabled=false

# Demo account passwords used ONLY when the accounts are first seeded (synthetic demo, not for real use).
# Override with environment variables APP_DEMO_ADMIN_PASSWORD / APP_DEMO_STAFF_PASSWORD.
app.demo.admin-password=Admin@12345
app.demo.staff-password=Staff@12345
